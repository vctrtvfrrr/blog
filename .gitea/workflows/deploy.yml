name: build-and-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: registry.codelab.tec.br
  IMAGE_PHP: registry.codelab.tec.br/vctrtvfrrr/blog
  IMAGE_NGINX: registry.codelab.tec.br/vctrtvfrrr/blog-nginx

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /opt/compose:/opt/compose
        - /opt/data:/opt/data
    steps:
      - uses: actions/checkout@v4

      - name: Registry login
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${REGISTRY}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build PHP image
        run: docker build -f Dockerfile -t "${IMAGE_PHP}:${{ github.sha }}" -t "${IMAGE_PHP}:latest" .

      - name: Build nginx image
        run: docker build -f Dockerfile.nginx -t "${IMAGE_NGINX}:${{ github.sha }}" -t "${IMAGE_NGINX}:latest" .

      - name: Push images
        run: |
          docker push "${IMAGE_PHP}:${{ github.sha }}"
          docker push "${IMAGE_PHP}:latest"
          docker push "${IMAGE_NGINX}:${{ github.sha }}"
          docker push "${IMAGE_NGINX}:latest"

      - name: Deploy stack
        # Consume the shared action by its FULL Gitea instance URL (ADR-0007/0009).
        # It renders /opt/compose/victorotavio/.env from .env.example + the
        # victorotavio Vault collection, rsyncs compose.yml, and runs up -d.
        uses: https://git.codelab.tec.br/codelab/deploy-stack@master
        with:
          service: victorotavio
          # Production config; secrets (APP_KEY, mail) come from the Vault
          # collection, local-dev defaults from .env.example.
          env-overrides: |
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=https://victorotavio.com.br
            DB_DATABASE=/var/www/html/database/database.sqlite
          # All-or-nothing Vault credential group (org-level Action secrets).
          bw-server: ${{ secrets.BW_SERVER }}
          bw-clientid: ${{ secrets.BW_CLIENTID }}
          bw-clientsecret: ${{ secrets.BW_CLIENTSECRET }}
          bw-password: ${{ secrets.BW_PASSWORD }}
